<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09271d">
  <title>Login | Rashid Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309271d'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='bold' text-anchor='middle' fill='%23a5e6b9'%3EMR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <p class="logo auth-brand">PORTFOLIO<span>.</span></p>
    <section class="auth-panel">
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1 id="heading">Welcome back<span>.</span></h1>
      <p class="muted" id="subheading">Sign in to manage your portfolio.</p>
      <p class="auth-message" id="authMessage" role="alert" aria-live="polite"></p>
      <form action="/login" method="POST" id="authForm">
        <div id="nameGroup" hidden>
          <label for="name">Full name</label>
          <input name="name" id="name" placeholder="Your full name" autocomplete="name" minlength="2" maxlength="100">
        </div>
        <label for="email">Email address</label>
        <input type="email" name="email" id="email" required placeholder="you@example.com" autocomplete="email">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required minlength="6" placeholder="At least 6 characters" autocomplete="current-password">
        <button class="button button-green full" id="submitButton" type="submit">Login to portfolio</button>
      </form>
      <p class="auth-switch" id="switchText">New here? <a href="#" id="switchLink">Create an account</a></p>
    </section>
    <p class="auth-foot">A simple portfolio built with Node.js &amp; MongoDB.</p>
  </main>
  <script src="auth.js" defer></script>
</body>
</html>
